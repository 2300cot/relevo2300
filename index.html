<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relevo Enfermería · Hab. 2301-2316</title>
<style>
  :root{
    --azul: #1c4e73;
    --azul-claro: #eaf1f6;
    --p-color: #2f6690;
    --v-color: #9c5b1f;
    --gris-borde: #cfd8de;
    --fondo: #f6f8f9;
    --texto: #1a2733;
    --ok: #2f7d4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fondo);
    color: var(--texto);
  }
  header{
    background: var(--azul);
    color:#fff;
    padding: 14px 16px;
    position: sticky; top:0; z-index: 10;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    flex-wrap:wrap;
  }
  header h1{ font-size:1.05rem; margin:0; font-weight:700; letter-spacing:.2px;}
  header .sub{font-size:.75rem; opacity:.85;}
  .toolbar{
    display:flex; gap:8px; padding:10px 16px; background:#fff;
    border-bottom:1px solid var(--gris-borde); flex-wrap:wrap; align-items:center;
    position: sticky; top:56px; z-index:9;
  }
  button{
    font: inherit; border:1px solid var(--gris-borde); background:#fff;
    padding:8px 12px; border-radius:8px; cursor:pointer; color:var(--texto);
  }
  button.primary{ background:var(--azul); color:#fff; border-color:var(--azul);}
  button.ghost{ background:transparent; }
  #status{ font-size:.8rem; color:#647485; margin-left:auto;}
  #status.saving{color:#b4790f;}
  #status.ok{color:var(--ok);}
  #status.err{color:#b3261e;}

  main{ padding: 10px 12px 60px; max-width: 900px; margin: 0 auto; }

  .room{
    background:#fff; border:1px solid var(--gris-borde); border-radius:12px;
    margin: 12px 0; overflow:hidden;
  }
  .room-head{
    display:flex; align-items:center; gap:8px;
    padding:10px 12px; background:var(--azul-claro); border-bottom:1px solid var(--gris-borde);
  }
  .room-head label{ display:flex; align-items:center; gap:6px; font-weight:700; font-size:.95rem;}
  .beds{ display:grid; grid-template-columns: 1fr 1fr; }
  @media (max-width: 560px){ .beds{ grid-template-columns: 1fr; } }
  .bed{ padding:10px 12px; }
  .bed + .bed{ border-left:1px solid var(--gris-borde); }
  @media (max-width:560px){ .bed + .bed{ border-left:none; border-top:1px solid var(--gris-borde);} }
  .bed-title{
    font-weight:700; font-size:.95rem; margin-bottom:8px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .bed-title .bed-number{ display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .bed-title .especialidad-select{
    width:auto; max-width:110px; padding:4px 6px; font-size:.78rem;
  }
  .bed-title .especialidad-select.dirty{ border-color:#b4790f; }
  .bed-title .especialidad-select.saved{ border-color:var(--ok); }
  .bed-title .tag{
    font-size:.65rem; padding:2px 6px; border-radius:999px; color:#fff;
  }
  .bed.P .tag{ background: var(--p-color); }
  .bed.V .tag{ background: var(--v-color); }

  .field{ margin-bottom:8px; }
  .field label{ display:block; font-size:.68rem; text-transform:uppercase; letter-spacing:.03em; color:#647485; margin-bottom:2px;}
  .field input, .field textarea, .field select, .rich-field{
    width:100%; border:1px solid var(--gris-borde); border-radius:6px; padding:6px 8px;
    font: inherit; font-size:.88rem; background:#fdfdfd;
  }
  .field textarea{ min-height:44px; resize: vertical; }
  .rich-field{
    min-height:26px; white-space:pre-wrap; word-break:break-word; outline:none;
    line-height:1.35;
  }
  .rich-field.grow-area{ min-height:68px; }
  .rich-field:focus{ border-color: var(--azul); }
  .rich-field font[size="5"]{ font-size:1.3em; }
  .rich-field font[size="1"]{ font-size:0.75em; }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  .row3{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; }

  .field.dirty input, .field.dirty textarea, .field.dirty select, .field.dirty .rich-field{
    border-color:#b4790f; background:#fff8ec;
  }
  .field.saved input, .field.saved textarea, .field.saved select, .field.saved .rich-field{
    border-color: var(--ok);
  }
  .sv-row{ display:flex; gap:4px; }
  .sv-row input, .sv-row select{ flex:1; min-width:0; }
  .alergia-select, .alergia-detalle{ background-color: #fff6c9; }
  .alergia-detalle{ font-weight:700; }

  /* ===== BARRA FLOTANTE DE FORMATO (aparece al seleccionar texto) ===== */
  #selectionToolbar{
    position:fixed; z-index:150; display:none;
    background:var(--texto); border-radius:8px; padding:5px;
    box-shadow:0 6px 18px rgba(0,0,0,.3);
    gap:4px;
  }
  #selectionToolbar.show{ display:flex; }
  #selectionToolbar button{
    background:transparent; border:none; color:#fff;
    padding:6px 10px; border-radius:5px; font-weight:700; font-size:.85rem;
    cursor:pointer;
  }
  #selectionToolbar button:active, #selectionToolbar button.active{ background:rgba(255,255,255,.25); }
  #selectionToolbar button#toolSize{ font-size:1rem; }

  /* ===== PANTALLA DE PIN ===== */
  #lockScreen{
    position:fixed; inset:0; background:var(--azul);
    display:flex; align-items:center; justify-content:center; z-index:100;
    padding:20px;
  }
  #lockScreen.hidden{ display:none; }
  .lock-box{
    background:#fff; border-radius:14px; padding:28px 24px; max-width:320px; width:100%;
    text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .lock-box h2{ margin:0 0 4px; font-size:1.1rem; color:var(--texto); }
  .lock-box p{ margin:0 0 16px; font-size:.82rem; color:#647485; }
  .lock-box input{
    width:100%; text-align:center; font-size:1.4rem; letter-spacing:.3em;
    padding:10px; border:1px solid var(--gris-borde); border-radius:8px; margin-bottom:10px;
  }
  .lock-box button{ width:100%; }
  .lock-box .err{ color:#b3261e; font-size:.8rem; min-height:1.1em; margin-bottom:8px; }

  /* ===== IMPRESIÓN: compacta, ~5 habitaciones por cara A4, con líneas de tabla ===== */
  @page{ size:A4; margin:8mm; }
  @media print{
    header, .toolbar, #lockScreen, .room-head, #selectionToolbar{ display:none !important; }
    body{ background:#fff; font-size:7pt; line-height:1.15; color:#000; }
    main{
      max-width:none; padding:0; margin:0;
      border:0.9pt solid #333; border-bottom:none;
    }
    .room{
      border:none; border-bottom:0.9pt solid #333; margin:0; padding:1.5pt 0;
      border-radius:0; break-inside: avoid;
    }
    .room.not-selected{ display:none; }
    .beds{ display:grid !important; grid-template-columns:1fr 1fr !important; gap:0; }
    .bed{ padding:1.5pt 4pt; }
    .bed + .bed{ border-left:0.9pt solid #333; border-top:none; }
    .bed-title{
      font-size:7.5pt; margin-bottom:2pt; font-weight:700; padding-bottom:1.5pt;
      border-bottom:0.5pt solid #999;
    }
    .bed-title .tag{
      padding:0 3pt; font-size:6pt;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
    }
    .field{ margin-bottom:0.5pt; }
    .field label{ font-size:5.3pt; margin-bottom:0; color:#555; }
    .field input, .field textarea, .field select, .rich-field{
      border:none; background:transparent; padding:0; font-size:7pt;
      min-height:auto; color:#000;
    }
    .field textarea{ min-height:7pt; }
    .field.grow textarea, .rich-field.grow-area{ min-height:22pt; }
    .row2, .row3{ gap:3pt; }
    .sv-row{ gap:2pt; }
    .especialidad-select{
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
      padding:0 2pt !important; border-radius:2pt;
    }
    .alergia-select, .alergia-detalle{
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
      padding:0 2pt !important;
    }
  }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <h2>Acceso restringido</h2>
    <p>Introduce el pin para ver el relevo</p>
    <div class="err" id="lockErr"></div>
    <input type="password" inputmode="numeric" id="pinInput" maxlength="12" autocomplete="off">
    <button class="primary" id="btnUnlock">Entrar</button>
  </div>
</div>

<header>
  <div>
    <h1>Relevo Enfermería</h1>
    <div class="sub">Habitaciones 2301–2316</div>
  </div>
  <div class="sub" id="lastSync">Sin datos aún</div>
</header>

<div class="toolbar">
  <button class="primary" id="btnRefresh">↻ Actualizar</button>
  <button id="btnSelectAll">Marcar todas</button>
  <button id="btnSelectNone">Desmarcar todas</button>
  <button class="ghost" id="btnPrint">🖨 Imprimir seleccionadas</button>
  <span id="status"></span>
</div>

<main id="rooms">
  <p style="text-align:center;color:#8a97a3;">Cargando habitaciones…</p>
</main>

<!-- Barra flotante: aparece al seleccionar texto dentro de un campo -->
<div id="selectionToolbar">
  <button type="button" id="toolBold" title="Negrita">N</button>
  <button type="button" id="toolSizeDown" title="Tamaño pequeño">A−</button>
  <button type="button" id="toolSizeUp" title="Tamaño grande">A+</button>
</div>

<script>
// ============ CONFIGURA AQUÍ TU URL DE APPS SCRIPT ============
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyzXABtB2gyTLIXa2IGTN8R_Q-bj8Os7TaDId58Q1eGFHBneFTcEKcr5QJGQUj8uKj5mg/exec';
// ================================================================

const FIELD_LABELS = {
  nombre: 'Nombre (edad)',
  especialidad: 'Especialidad',
  jc: 'Juicio clínico',
  ap: 'Antecedentes personales',
  alergiaSiNo: 'Alergias',
  alergiaDetalle: 'Detalle alergia',
  viaTipo: 'Vía (tipo)',
  viaFecha: 'Vía (fecha)',
  pte: 'Pendiente',
  otros: 'Otros'
};

// Campos donde se puede seleccionar una parte del texto y ponerla en
// negrita / agrandarla (formato mixto, guardado como texto enriquecido
// real en la celda de Google Sheets).
const RICHTEXT_FIELDS = ['nombre', 'jc', 'ap', 'viaFecha', 'pte', 'otros'];
const RICHTEXT_MULTILINE = ['jc', 'ap', 'pte', 'otros'];

const ESPECIALIDADES = ['', 'COT', 'CIR', 'MI', 'URO', 'NEU', 'DIG', 'CAR', 'OFT', 'DER', 'ORL', 'NEFR'];

const ESPECIALIDAD_COLORS = {
  COT:  '#ffe9c7',
  CIR:  '#ffd6d6',
  MI:   '#d6ebff',
  URO:  '#e6d6ff',
  NEU:  '#d6ffe9',
  DIG:  '#fff9d6',
  CAR:  '#ffd6ec',
  OFT:  '#d6fff5',
  DER:  '#f0d6ff',
  ORL:  '#e3ffd6',
  NEFR: '#ffe0d6'
};

const SV_TIPOS = ['', 'Implantación', 'Extracción'];
const VIA_TIPOS = ['', 'VVP', 'VVC', 'VO', 'PICC', 'Reservorio'];

let roomsData = [];
let saveTimers = {};

function getPin(){
  return sessionStorage.getItem('relevoPin') || '';
}

async function loadData(){
  setStatus('Cargando…', '');
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?action=read&pin=' + encodeURIComponent(getPin()));
    const json = await res.json();
    if(!json.ok){
      if(json.error === 'PIN incorrecto'){
        sessionStorage.removeItem('relevoPin');
        showLock('PIN incorrecto. Inténtalo de nuevo.');
        return false;
      }
      throw new Error(json.error || 'Error desconocido');
    }
    roomsData = json.data;
    render();
    setStatus('Actualizado', 'ok');
    document.getElementById('lastSync').textContent =
      'Última actualización: ' + new Date().toLocaleTimeString('es-ES');
    return true;
  }catch(err){
    setStatus('Error al cargar: ' + err.message, 'err');
    return false;
  }
}

function showLock(errMsg){
  document.getElementById('lockScreen').classList.remove('hidden');
  document.getElementById('lockErr').textContent = errMsg || '';
  const input = document.getElementById('pinInput');
  input.value = '';
  setTimeout(() => input.focus(), 50);
}

function hideLock(){
  document.getElementById('lockScreen').classList.add('hidden');
}

async function tryUnlock(){
  const pin = document.getElementById('pinInput').value.trim();
  if(!pin){ return; }
  sessionStorage.setItem('relevoPin', pin);
  document.getElementById('lockErr').textContent = '';
  const success = await loadData();
  if(success) hideLock();
}

document.getElementById('btnUnlock').addEventListener('click', tryUnlock);
document.getElementById('pinInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') tryUnlock();
});

function setStatus(msg, cls){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}

function render(){
  const main = document.getElementById('rooms');
  main.innerHTML = '';
  roomsData.forEach(room => {
    const div = document.createElement('div');
    div.className = 'room';
    div.dataset.roomL = room.roomL;

    const head = document.createElement('div');
    head.className = 'room-head';
    head.innerHTML = `
      <label>
        <input type="checkbox" class="printChk" checked>
        Hab. ${room.roomL.replace(/[PV]$/,'')}
      </label>`;
    div.appendChild(head);

    const bedsWrap = document.createElement('div');
    bedsWrap.className = 'beds';
    room.beds.forEach((bed, idx) => {
      const roomCode = idx === 0 ? room.roomL : room.roomR;
      const bedLetter = room.double ? (idx === 0 ? 'P' : 'V') : '·';
      bedsWrap.appendChild(renderBed(roomCode, bedLetter, bed));
    });
    div.appendChild(bedsWrap);
    main.appendChild(div);
  });
}

function renderBed(roomCode, bedLetter, bed){
  const wrap = document.createElement('div');
  wrap.className = 'bed ' + (bedLetter === 'P' ? 'P' : bedLetter === 'V' ? 'V' : '');

  const title = document.createElement('div');
  title.className = 'bed-title';

  const numSpan = document.createElement('span');
  numSpan.className = 'bed-number';
  numSpan.innerHTML = bedLetter !== '·'
    ? `${roomCode.replace(/[PV]$/,'')} <span class="tag">${bedLetter}</span>`
    : roomCode;
  title.appendChild(numSpan);
  title.appendChild(makeEspecialidadSelect(roomCode, bed.especialidad));
  wrap.appendChild(title);

  wrap.appendChild(makeField(roomCode, 'nombre', bed.nombre, bed.nombreHtml));
  wrap.appendChild(makeField(roomCode, 'jc', bed.jc, bed.jcHtml, true));
  wrap.appendChild(makeField(roomCode, 'ap', bed.ap, bed.apHtml, true));

  const row2 = document.createElement('div');
  row2.className = 'row2';
  row2.appendChild(makeField(roomCode, 'alergiaSiNo', bed.alergiaSiNo));
  row2.appendChild(makeField(roomCode, 'alergiaDetalle', bed.alergiaDetalle));
  wrap.appendChild(row2);

  const row3 = document.createElement('div');
  row3.className = 'row3';
  row3.appendChild(makeField(roomCode, 'viaTipo', bed.viaTipo));
  row3.appendChild(makeField(roomCode, 'viaFecha', bed.viaFecha, bed.viaFechaHtml));
  row3.appendChild(makeSvField(roomCode, bed.svFechaExtra));
  wrap.appendChild(row3);

  wrap.appendChild(makeField(roomCode, 'pte', bed.pte, bed.pteHtml, true, true));
  wrap.appendChild(makeField(roomCode, 'otros', bed.otros, bed.otrosHtml, true, true));

  return wrap;
}

// SV se guarda en una sola celda como "fecha (Implantación)" / "fecha (Extracción)" / "fecha"
function parseSvValue(raw){
  raw = (raw || '').toString().trim();
  const m = raw.match(/^(.*?)\s*\((Implantaci[oó]n|Extracci[oó]n)\)\s*$/i);
  if(m) return { fecha: m[1].trim(), tipo: m[2][0].toUpperCase() + m[2].slice(1).toLowerCase() };
  return { fecha: raw, tipo: '' };
}
function composeSvValue(fecha, tipo){
  fecha = (fecha || '').trim();
  if(!fecha) return '';
  return tipo ? `${fecha} (${tipo})` : fecha;
}

function makeSvField(roomCode, rawValue){
  const box = document.createElement('div');
  box.className = 'field';
  const label = document.createElement('label');
  label.textContent = 'SV (fecha / tipo)';
  box.appendChild(label);

  const { fecha, tipo } = parseSvValue(rawValue);

  const row = document.createElement('div');
  row.className = 'sv-row';

  const dateInput = document.createElement('input');
  dateInput.type = 'text';
  dateInput.value = fecha;
  dateInput.placeholder = 'dd/mm';

  const tipoSelect = document.createElement('select');
  SV_TIPOS.forEach(opt => {
    const o = document.createElement('option');
    o.value = opt; o.textContent = opt || '—';
    if(opt === tipo) o.selected = true;
    tipoSelect.appendChild(o);
  });

  function trigger(){
    box.classList.add('dirty');
    box.classList.remove('saved');
    scheduleSave(roomCode, 'svFechaExtra', composeSvValue(dateInput.value, tipoSelect.value), box);
  }
  dateInput.addEventListener('input', trigger);
  tipoSelect.addEventListener('change', trigger);

  row.appendChild(dateInput);
  row.appendChild(tipoSelect);
  box.appendChild(row);
  return box;
}

// value = texto plano (siempre); htmlValue = versión con <b>/<font size> si el
// campo admite texto enriquecido (RICHTEXT_FIELDS); grow = campo más alto (PTE/OTROS)
function makeField(roomCode, field, value, htmlValue, isRich, grow){
  const box = document.createElement('div');
  box.className = 'field' + (grow ? ' grow' : '');
  const label = document.createElement('label');
  label.textContent = FIELD_LABELS[field];
  box.appendChild(label);

  if(isRich && RICHTEXT_FIELDS.includes(field)){
    const div = document.createElement('div');
    div.className = 'rich-field' + (RICHTEXT_MULTILINE.includes(field) ? ' grow-area' : '');
    div.contentEditable = 'true';
    div.dataset.room = roomCode;
    div.dataset.field = field;
    if(htmlValue){ div.innerHTML = htmlValue; }
    else { div.textContent = value || ''; }

    div.addEventListener('input', () => {
      box.classList.add('dirty');
      box.classList.remove('saved');
      scheduleSaveRich(div, box);
    });

    box.appendChild(div);
    return box;
  }

  if(RICHTEXT_FIELDS.includes(field) && !isRich){
    // nombre / viaFecha: texto enriquecido pero en una sola línea
    const div = document.createElement('div');
    div.className = 'rich-field';
    div.contentEditable = 'true';
    div.dataset.room = roomCode;
    div.dataset.field = field;
    if(htmlValue){ div.innerHTML = htmlValue; }
    else { div.textContent = value || ''; }

    div.addEventListener('input', () => {
      box.classList.add('dirty');
      box.classList.remove('saved');
      scheduleSaveRich(div, box);
    });
    div.addEventListener('keydown', (e) => {
      if(e.key === 'Enter') e.preventDefault(); // campo de una sola línea
    });

    box.appendChild(div);
    return box;
  }

  let input;
  if(field === 'alergiaSiNo'){
    input = document.createElement('select');
    input.classList.add('alergia-select');
    ['', 'NO', 'SI'].forEach(opt => {
      const o = document.createElement('option');
      o.value = opt; o.textContent = opt || '—';
      if(String(value).toUpperCase() === opt) o.selected = true;
      input.appendChild(o);
    });
  } else if(field === 'alergiaDetalle'){
    input = document.createElement('input');
    input.type = 'text';
    input.value = value || '';
    input.classList.add('alergia-detalle');
  } else if(field === 'especialidad'){
    input = document.createElement('select');
    input.classList.add('especialidad-select');
    ESPECIALIDADES.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt; o.textContent = opt || '—';
      if(String(value).toUpperCase() === opt.toUpperCase()) o.selected = true;
      input.appendChild(o);
    });
  } else if(field === 'viaTipo'){
    input = document.createElement('select');
    VIA_TIPOS.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt; o.textContent = opt || '—';
      if(String(value).toUpperCase() === opt.toUpperCase()) o.selected = true;
      input.appendChild(o);
    });
  } else {
    input = document.createElement('input');
    input.type = 'text';
    input.value = value || '';
  }

  input.addEventListener('input', () => {
    box.classList.add('dirty');
    box.classList.remove('saved');
    scheduleSave(roomCode, field, input.value, box);
  });
  if(input.tagName === 'SELECT'){
    input.addEventListener('change', () => {
      box.classList.add('dirty');
      box.classList.remove('saved');
      scheduleSave(roomCode, field, input.value, box);
      if(field === 'especialidad') applyEspecialidadColor(input);
    });
  }

  if(field === 'especialidad'){
    applyEspecialidadColor(input);
  }

  box.appendChild(input);
  return box;
}

function makeEspecialidadSelect(roomCode, value){
  const select = document.createElement('select');
  select.className = 'especialidad-select';
  ESPECIALIDADES.forEach(opt => {
    const o = document.createElement('option');
    o.value = opt; o.textContent = opt || '—';
    if(String(value).toUpperCase() === opt.toUpperCase()) o.selected = true;
    select.appendChild(o);
  });
  applyEspecialidadColor(select);
  select.addEventListener('change', () => {
    applyEspecialidadColor(select);
    select.classList.add('dirty');
    select.classList.remove('saved');
    scheduleSave(roomCode, 'especialidad', select.value, select);
  });
  return select;
}

function applyEspecialidadColor(select){
  const color = ESPECIALIDAD_COLORS[select.value.toUpperCase()];
  select.style.backgroundColor = color || '';
  select.style.fontWeight = color ? '700' : '';
}

function scheduleSave(roomCode, field, value, box){
  const key = roomCode + '|' + field;
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(() => saveField(roomCode, field, value, box), 700);
}

async function saveField(roomCode, field, value, box){
  setStatus('Guardando…', 'saving');
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'write', room: roomCode, field, value, pin: getPin() })
    });
    const json = await res.json();
    if(!json.ok){
      if(json.error === 'PIN incorrecto'){
        sessionStorage.removeItem('relevoPin');
        showLock('Tu sesión ha caducado. Vuelve a introducir el PIN.');
      }
      throw new Error(json.error || 'Error al guardar');
    }
    box.classList.remove('dirty');
    box.classList.add('saved');
    setStatus('Guardado ✓', 'ok');
  }catch(err){
    setStatus('Error al guardar: ' + err.message, 'err');
  }
}

// ===== TEXTO ENRIQUECIDO (negrita / tamaño parcial) =====

// Recorre el contenido de un campo editable y extrae el texto plano
// junto con los tramos (runs) marcados en negrita y/o tamaño (pequeño/grande).
function extractRuns(root){
  let text = '';
  const runs = [];
  function walk(node, bold, size){
    if(node.nodeType === Node.TEXT_NODE){
      const start = text.length;
      text += node.textContent;
      const end = text.length;
      if(end > start) runs.push({ start, end, bold, size });
      return;
    }
    if(node.nodeType !== Node.ELEMENT_NODE) return;
    let nb = bold, ns = size;
    const tag = node.tagName;
    if(tag === 'B' || tag === 'STRONG') nb = true;
    if(node.style && (node.style.fontWeight === 'bold' || node.style.fontWeight === '700')) nb = true;
    if(tag === 'FONT' && node.getAttribute('size')){
      const n = parseInt(node.getAttribute('size'), 10);
      if(n >= 4) ns = 'large';
      else if(n <= 2) ns = 'small';
      else ns = 'normal';
    }
    Array.from(node.childNodes).forEach(child => walk(child, nb, ns));
  }
  Array.from(root.childNodes).forEach(child => walk(child, false, 'normal'));

  const merged = [];
  runs.forEach(r => {
    const last = merged[merged.length - 1];
    if(last && last.bold === r.bold && last.size === r.size && last.end === r.start){
      last.end = r.end;
    } else {
      merged.push({ ...r });
    }
  });
  return { text, runs: merged };
}

function scheduleSaveRich(div, box){
  const key = div.dataset.room + '|' + div.dataset.field;
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(() => saveRichField(div, box), 700);
}

async function saveRichField(div, box){
  const { text, runs } = extractRuns(div);
  const payload = {
    action: 'writeRich',
    room: div.dataset.room,
    field: div.dataset.field,
    text,
    runs: runs.map(r => ({
      start: r.start, end: r.end, bold: r.bold,
      size: r.size === 'large' ? 13 : r.size === 'small' ? 7 : null
    })),
    pin: getPin()
  };
  setStatus('Guardando…', 'saving');
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if(!json.ok){
      if(json.error === 'PIN incorrecto'){
        sessionStorage.removeItem('relevoPin');
        showLock('Tu sesión ha caducado. Vuelve a introducir el PIN.');
      }
      throw new Error(json.error || 'Error al guardar');
    }
    if(box){ box.classList.remove('dirty'); box.classList.add('saved'); }
    setStatus('Guardado ✓', 'ok');
  }catch(err){
    setStatus('Error al guardar: ' + err.message, 'err');
  }
}

// ===== BARRA FLOTANTE DE FORMATO =====
const selToolbar = document.getElementById('selectionToolbar');
const toolBold = document.getElementById('toolBold');
const toolSizeUp = document.getElementById('toolSizeUp');
const toolSizeDown = document.getElementById('toolSizeDown');
let activeRichField = null;

// Evita que al pulsar los botones se pierda la selección de texto
selToolbar.addEventListener('mousedown', (e) => e.preventDefault());

document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if(!sel || sel.rangeCount === 0 || sel.isCollapsed){
    selToolbar.classList.remove('show');
    return;
  }
  const range = sel.getRangeAt(0);
  const container = range.commonAncestorContainer;
  const el = container.nodeType === Node.ELEMENT_NODE ? container : container.parentElement;
  const richField = el ? el.closest('.rich-field') : null;

  if(!richField){
    selToolbar.classList.remove('show');
    return;
  }
  activeRichField = richField;

  const rect = range.getBoundingClientRect();
  if(rect.width === 0 && rect.height === 0){
    selToolbar.classList.remove('show');
    return;
  }
  selToolbar.classList.add('show');
  const toolbarWidth = selToolbar.offsetWidth || 90;
  let left = rect.left + rect.width / 2 - toolbarWidth / 2;
  left = Math.max(6, Math.min(left, window.innerWidth - toolbarWidth - 6));
  let top = rect.top - 44;
  if(top < 6) top = rect.bottom + 8;
  selToolbar.style.left = left + 'px';
  selToolbar.style.top = top + 'px';
});

function findFieldBox(el){
  return el.closest('.field');
}

toolBold.addEventListener('click', () => {
  if(!activeRichField) return;
  document.execCommand('bold');
  const box = findFieldBox(activeRichField);
  if(box){ box.classList.add('dirty'); box.classList.remove('saved'); }
  scheduleSaveRich(activeRichField, box);
});

toolSizeUp.addEventListener('click', () => {
  if(!activeRichField) return;
  const current = document.queryCommandValue('fontSize');
  document.execCommand('fontSize', false, current === '5' ? '3' : '5');
  const box = findFieldBox(activeRichField);
  if(box){ box.classList.add('dirty'); box.classList.remove('saved'); }
  scheduleSaveRich(activeRichField, box);
});

toolSizeDown.addEventListener('click', () => {
  if(!activeRichField) return;
  const current = document.queryCommandValue('fontSize');
  document.execCommand('fontSize', false, current === '1' ? '3' : '1');
  const box = findFieldBox(activeRichField);
  if(box){ box.classList.add('dirty'); box.classList.remove('saved'); }
  scheduleSaveRich(activeRichField, box);
});

document.getElementById('btnRefresh').addEventListener('click', loadData);
document.getElementById('btnSelectAll').addEventListener('click', () => {
  document.querySelectorAll('.printChk').forEach(c => c.checked = true);
});
document.getElementById('btnSelectNone').addEventListener('click', () => {
  document.querySelectorAll('.printChk').forEach(c => c.checked = false);
});
document.getElementById('btnPrint').addEventListener('click', () => {
  document.querySelectorAll('.room').forEach(room => {
    const chk = room.querySelector('.printChk');
    room.classList.toggle('not-selected', !chk.checked);
  });
  window.print();
});

// Al abrir la web: si ya había un PIN válido en esta pestaña, entra directo;
// si no, muestra el candado.
if(getPin()){
  loadData().then(success => { if(success) hideLock(); });
} else {
  showLock();
}

// Auto-refresh cada 60s para ver cambios de otras compañeras (no pisa lo que estés escribiendo,
// y no hace nada si todavía no se ha introducido el PIN)
setInterval(() => {
  const activeTag = document.activeElement.tagName;
  const isEditing = activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT'
    || (document.activeElement && document.activeElement.isContentEditable);
  const locked = !document.getElementById('lockScreen').classList.contains('hidden');
  if(!locked && !isEditing){
    loadData();
  }
}, 60000);
</script>
