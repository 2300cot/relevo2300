<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relevo Enfermería · Hab. 2301-2316</title>
<style>
  :root{
    --azul: #1c4e73;
    --azul-claro: #eaf1f6;
    --p-color: #2f6690;
    --v-color: #9c5b1f;
    --gris-borde: #cfd8de;
    --fondo: #f6f8f9;
    --texto: #1a2733;
    --ok: #2f7d4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fondo);
    color: var(--texto);
  }
  header{
    background: var(--azul);
    color:#fff;
    padding: 14px 16px;
    position: sticky; top:0; z-index: 10;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    flex-wrap:wrap;
  }
  header h1{ font-size:1.05rem; margin:0; font-weight:700; letter-spacing:.2px;}
  header .sub{font-size:.75rem; opacity:.85;}
  .toolbar{
    display:flex; gap:8px; padding:10px 16px; background:#fff;
    border-bottom:1px solid var(--gris-borde); flex-wrap:wrap; align-items:center;
    position: sticky; top:56px; z-index:9;
  }
  button{
    font: inherit; border:1px solid var(--gris-borde); background:#fff;
    padding:8px 12px; border-radius:8px; cursor:pointer; color:var(--texto);
  }
  button.primary{ background:var(--azul); color:#fff; border-color:var(--azul);}
  button.ghost{ background:transparent; }
  #status{ font-size:.8rem; color:#647485; margin-left:auto;}
  #status.saving{color:#b4790f;}
  #status.ok{color:var(--ok);}
  #status.err{color:#b3261e;}

  main{ padding: 10px 12px 60px; max-width: 1100px; margin: 0 auto; }

  .room{
    background:#fff; border:1px solid var(--gris-borde); border-radius:12px;
    margin: 12px 0; overflow:hidden;
  }
  .room-head{
    display:flex; align-items:center; gap:8px;
    padding:10px 12px; background:var(--azul-claro); border-bottom:1px solid var(--gris-borde);
  }
  .room-head label{ display:flex; align-items:center; gap:6px; font-weight:700; font-size:.95rem;}
  .beds{ display:grid; grid-template-columns: 1fr 1fr; }
  @media (max-width: 560px){ .beds{ grid-template-columns: 1fr; } }
  .bed{ padding:10px 12px; }
  .bed + .bed{ border-left:1px solid var(--gris-borde); }
  @media (max-width:560px){ .bed + .bed{ border-left:none; border-top:1px solid var(--gris-borde);} }

  .bed-title{
    font-weight:700; font-size:.95rem; margin-bottom:8px;
    display:flex; align-items:center; justify-content:space-between; gap:6px;
  }
  .bed-title .bed-number{ display:flex; align-items:center; gap:4px; white-space:nowrap; }
  .bed-title .header-nombre-box{ flex:1; margin:0 4px; }
  .bed-title .especialidad-select{
    width:auto; max-width:100px; padding:4px 6px; font-size:.78rem;
  }
  .bed-title .especialidad-select.dirty{ border-color:#b4790f; }
  .bed-title .especialidad-select.saved{ border-color:var(--ok); }
  .bed-title .tag{
    font-size:.65rem; padding:2px 6px; border-radius:999px; color:#fff;
  }
  .bed.P .tag{ background: var(--p-color); }
  .bed.V .tag{ background: var(--v-color); }

  .field{ margin-bottom:8px; }
  .field label{ display:block; font-size:.68rem; text-transform:uppercase; letter-spacing:.03em; color:#647485; margin-bottom:2px;}
  .field input, .field select, .rich-field{
    width:100%; border:1px solid var(--gris-borde); border-radius:6px; padding:6px 8px;
    font: inherit; font-size:.88rem; background:#fdfdfd;
  }

  /* ===== DIMENSIONADO EXACTO RÉPLICA GOOGLE SHEETS ===== */
  .rich-field{
    white-space:pre-wrap; word-break:break-word; outline:none;
    line-height:1.25; font-size:13px; font-family: Arial, sans-serif;
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
  }

  /* Alturas fijas proporcionales a las filas de Sheets */
  .rich-field.inline-name{
    min-height:28px; height:28px; padding:4px 6px;
  }
  .rich-field.field-jc{
    min-height:42px; height:42px;
  }
  .rich-field.field-ap{
    min-height:75px; height:75px;
  }
  .rich-field.field-pte{
    min-height:75px; height:75px;
  }
  .rich-field.field-otros{
    min-height:75px; height:75px;
  }

  .rich-field:focus{ border-color: var(--azul); background:#fff; }
  .rich-field font[size="5"]{ font-size:14px; }
  .rich-field font[size="3"]{ font-size:13px; }
  .rich-field font[size="1"]{ font-size:11px; }

  .char-counter{
    font-size:.65rem; color:#8a97a3; text-align:right; margin-top:2px;
  }
  .char-counter.over{ color:#b3261e; font-weight:700; }
  .row2{ display:grid; grid-template-columns: auto 1fr; gap:8px; }
  .row3{ display:grid; grid-template-columns: 1fr 1fr 1.2fr; gap:6px; }

  .field.dirty input, .field.dirty select, .field.dirty .rich-field{
    border-color:#b4790f; background:#fff8ec;
  }
  .field.saved input, .field.saved select, .field.saved .rich-field{
    border-color: var(--ok);
  }

  /* ===== ALINEACIÓN SV / CD (COLUMNA Y SEPARACIÓN MEJORADA) ===== */
  .sv-row{ display:flex; flex-direction:row; align-items:flex-start; justify-content:space-around; gap:12px; width:100%; }
  .sv-group-sv{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .sv-group-cd{ display:flex; flex-direction:column; align-items:center; justify-content:flex-start; }
  .sv-check{
    display:flex; align-items:center; gap:3px; font-size:.75rem; color:#647485;
    white-space:nowrap; cursor:pointer;
  }
  .sv-check input[type="checkbox"]{
    width:16px; height:16px; margin:0; accent-color: var(--azul); cursor:pointer;
  }
  .date-input{ width:58px !important; flex:none !important; text-align:center; padding:3px !important; font-size:.8rem !important; }
  .alergia-select{ width:auto; min-width:0; padding-left:4px; padding-right:4px; }
  .alergia-detalle{ font-weight:700; }

  /* ===== BARRA FLOTANTE DE FORMATO ===== */
  #selectionToolbar{
    position:fixed; z-index:150; display:none;
    background:var(--texto); border-radius:8px; padding:5px;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }
  .fmt-btn-group{ display:flex; gap:3px; align-items:center; }
  .fmt-btn{
    background:transparent; border:none; color:#fff;
    padding:4px 8px; font-size:.85rem; border-radius:4px;
    cursor:pointer; line-height:1; min-width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
  }
  .fmt-btn:hover{ background:rgba(255,255,255,0.2); }
  .fmt-btn.active{ background:rgba(255,255,255,0.35); font-weight:bold; }
  .fmt-separator{ width:1px; height:18px; background:rgba(255,255,255,0.2); margin:0 2px; }

  /* ===== ESTILOS IMPRESIÓN (PDF REGLAS DENSE) ===== */
  @media print {
    @page { size: A4 landscape; margin: 4mm 5mm 4mm 5mm; }
    html, body {
      background: #fff !important; color: #000 !important;
      font-size: 8pt !important; line-height: 1.15 !important;
      font-family: Arial, sans-serif !important; margin: 0 !important; padding: 0 !important;
    }
    header, .toolbar, #selectionToolbar, .char-counter { display: none !important; }
    main { padding: 0 !important; max-width: 100% !important; margin: 0 !important; }

    /* Forzar salto de página cada 4 habitaciones (8 camas / 2 páginas totales) */
    .room {
      background: #fff !important; border: 1px solid #000 !important;
      border-radius: 0 !important; margin: 0 0 3px 0 !important;
      page-break-inside: avoid !important; break-inside: avoid !important;
    }
    .room:nth-of-type(4n) { page-break-after: always !important; break-after: page !important; }

    .room-head {
      background: #eaf1f6 !important; border-bottom: 1px solid #000 !important;
      padding: 1px 4px !important; -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .room-head label { font-size: 8.5pt !important; font-weight: bold !important; color: #000 !important; }
    .beds { display: grid !important; grid-template-columns: 1fr 1fr !important; }
    .bed { padding: 2px 4px !important; border: none !important; }
    .bed + .bed { border-left: 1px solid #000 !important; }

    .bed-title { margin-bottom: 2px !important; font-size: 8.5pt !important; font-weight: bold !important; }
    .bed-title .tag { border: 1px solid #000 !important; color: #000 !important; background: transparent !important; font-size: 6.5pt !important; padding: 0 2px !important;}

    .field { margin-bottom: 2px !important; }
    .field label { font-size: 6.5pt !important; font-weight: bold !important; color: #000 !important; margin-bottom: 0 !important; display: block !important;}

    .field input, .field select, .rich-field {
      border: 1px solid #777 !important; border-radius: 0 !important;
      padding: 1px 3px !important; font-size: 8pt !important; background: #fff !important;
      color: #000 !important; box-shadow: none !important;
    }

    .rich-field {
      display: block !important; overflow: hidden !important;
      white-space: pre-wrap !important; word-break: break-word !important;
    }
    .rich-field.inline-name { min-height: 14pt !important; height: 14pt !important; }
    .rich-field.field-jc { min-height: 24pt !important; height: 24pt !important; }
    .rich-field.field-ap { min-height: 48pt !important; height: 48pt !important; }
    .rich-field.field-pte { min-height: 48pt !important; height: 48pt !important; }
    .rich-field.field-otros { min-height: 48pt !important; height: 48pt !important; }

    .rich-field font[size="5"] { font-size: 9.5pt !important; }
    .rich-field font[size="3"] { font-size: 8pt !important; }
    .rich-field font[size="1"] { font-size: 6.5pt !important; }

    .sv-row { display: flex !important; flex-direction: row !important; gap: 8px !important; align-items: flex-start !important; justify-content: flex-start !important; }
    .sv-group-sv, .sv-group-cd { display: flex !important; flex-direction: column !important; align-items: flex-start !important; }
    .sv-check { font-size: 7.5pt !important; color: #000 !important; }
    .sv-check input[type="checkbox"] { width: 10px !important; height: 10px !important; margin-right: 2px !important; }
    .date-input { width: 45px !important; padding: 0 !important; font-size: 7.5pt !important; }

    select { -webkit-appearance: none; -moz-appearance: none; appearance: none; background: #fff !important; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>RELEVO ENFERMERÍA · PLANTA 3ª</h1>
    <div class="sub">Habitaciones 2301 - 2316</div>
  </div>
  <div style="font-size:.8rem; opacity:.9;" id="dateDisplay"></div>
</header>

<div class="toolbar">
  <button id="btnSave" class="primary" onclick="manualSave()">Guardar datos</button>
  <button id="btnPrint" onclick="window.print()">Imprimir PDF</button>
  <button class="ghost" onclick="resetForm()">Limpiar cambios</button>
  <span id="status">Sincronizado</span>
</div>

<!-- BARRA DE FORMATO FLOTANTE -->
<div id="selectionToolbar" onmousedown="event.preventDefault()">
  <div class="fmt-btn-group">
    <button class="fmt-btn" id="btnBold" title="Negrita (Ctrl+B)"><b>B</b></button>
    <button class="fmt-btn" id="btnItalic" title="Cursiva (Ctrl+I)"><i>I</i></button>
    <button class="fmt-btn" id="btnUnderline" title="Subrayado (Ctrl+U)"><u>U</u></button>
    <div class="fmt-separator"></div>
    <button class="fmt-btn" id="btnSizeSmall" title="Texto Pequeño">A<sup>-</sup></button>
    <button class="fmt-btn" id="btnSizeNormal" title="Texto Normal">A</button>
    <button class="fmt-btn" id="btnSizeLarge" title="Texto Grande">A<sup>+</sup></button>
  </div>
</div>

<main id="roomsContainer"></main>

<script>
  // CONFIGURACIÓN DE HABITACIONES
  const startRoom = 2301;
  const endRoom = 2316;
  const STORAGE_KEY = "relevo_enfermeria_2301_2316_v4";
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnvokK8bkwsp5u92QbDIQOc827CZOF9IXj06vIsyeQcdp2Nskwx2gzVi06dJxWu_xG/exec";

  // ESPECIALIDADES Y ALERGIAS
  const ESPECIALIDADES = ["","CGD","COT","NEU","CCA","ORL","URO","NEF","DIG","MED","CIR","DER","OFT","GINE","OBS","PSI","PED","ONC","CARD"];
  const ALERGIAS_LISTA = ["NO", "SÍ", "NS/NC"];

  // LÍMITES DE CARACTERES
  const MAX_CHARS = {
    nombre: 40,
    jc: 60,
    ap: 150,
    pte: 150,
    otros: 150
  };

  let activeRichField = null;

  document.getElementById("dateDisplay").innerText = new Date().toLocaleDateString('es-ES', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  // GENERAR INTERFAZ
  function buildUI() {
    const container = document.getElementById("roomsContainer");
    let html = "";

    for (let r = startRoom; r <= endRoom; r++) {
      html += `
      <div class="room" id="r_${r}">
        <div class="room-head">
          <label><input type="checkbox" class="room-lock" data-room="${r}"> Habitación ${r}</label>
        </div>
        <div class="beds">
          ${buildBedHTML(r, 'P')}
          ${buildBedHTML(r, 'V')}
        </div>
      </div>`;
    }
    container.innerHTML = html;
    attachEvents();
  }

  function buildBedHTML(room, bedType) {
    const id = `${room}_${bedType}`;
    return `
    <div class="bed ${bedType}" id="b_${id}">
      <div class="bed-title">
        <div class="bed-number">
          <span>${room} ${bedType}</span>
          <span class="tag">${bedType === 'P' ? 'Pasillo' : 'Ventana'}</span>
        </div>
        <div class="header-nombre-box">
          <div class="rich-field inline-name" contenteditable="true" data-bed="${id}" data-field="nombre" data-max="${MAX_CHARS.nombre}" placeholder="Nombre paciente"></div>
          <div class="char-counter" id="cnt_${id}_nombre">0/${MAX_CHARS.nombre}</div>
        </div>
        <select class="especialidad-select" data-bed="${id}" data-field="especialidad">
          ${ESPECIALIDADES.map(e => `<option value="${e}">${e || 'Esp...'}</option>`).join('')}
        </select>
      </div>

      <div class="field">
        <div class="row3">
          <div>
            <label>Alergias</label>
            <select class="alergia-select" data-bed="${id}" data-field="alergia" onchange="toggleAlergiaColor(this)">
              ${ALERGIAS_LISTA.map(a => `<option value="${a}">${a}</option>`).join('')}
            </select>
          </div>
          <div>
            <label>Detalle Alergia</label>
            <input type="text" class="alergia-detalle" data-bed="${id}" data-field="alergia_detalle" placeholder="¿A qué?" />
          </div>
          <div>
            <label>Constantes / Cuidados</label>
            <div class="sv-row">
              <div class="sv-group-sv">
                <label class="sv-check"><input type="checkbox" data-bed="${id}" data-field="sv_m"> M</label>
                <label class="sv-check"><input type="checkbox" data-bed="${id}" data-field="sv_t"> T</label>
                <label class="sv-check"><input type="checkbox" data-bed="${id}" data-field="sv_n"> N</label>
              </div>
              <div class="sv-group-cd">
                <label class="sv-check"><input type="checkbox" data-bed="${id}" data-field="cd_check"> CD</label>
                <input type="text" class="date-input" data-bed="${id}" data-field="cd_fecha" placeholder="dd/mm" maxlength="5">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="field">
        <label>Juicio Clínico / Intervención</label>
        <div class="rich-field field-jc" contenteditable="true" data-bed="${id}" data-field="jc" data-max="${MAX_CHARS.jc}"></div>
        <div class="char-counter" id="cnt_${id}_jc">0/${MAX_CHARS.jc}</div>
      </div>

      <div class="field">
        <label>Antecedentes / Aislamiento</label>
        <div class="rich-field field-ap" contenteditable="true" data-bed="${id}" data-field="ap" data-max="${MAX_CHARS.ap}"></div>
        <div class="char-counter" id="cnt_${id}_ap">0/${MAX_CHARS.ap}</div>
      </div>

      <div class="field">
        <label>Pendiente</label>
        <div class="rich-field field-pte" contenteditable="true" data-bed="${id}" data-field="pte" data-max="${MAX_CHARS.pte}"></div>
        <div class="char-counter" id="cnt_${id}_pte">0/${MAX_CHARS.pte}</div>
      </div>

      <div class="field">
        <label>Otros / Dieta / Analítica</label>
        <div class="rich-field field-otros" contenteditable="true" data-bed="${id}" data-field="otros" data-max="${MAX_CHARS.otros}"></div>
        <div class="char-counter" id="cnt_${id}_otros">0/${MAX_CHARS.otros}</div>
      </div>
    </div>`;
  }

  // BINDING DE EVENTOS
  function attachEvents() {
    document.querySelectorAll('.rich-field').forEach(elem => {
      elem.addEventListener('input', (e) => {
        sanitizeRichText(elem);
        updateCharCounter(elem);
        markDirty(elem);
      });
      elem.addEventListener('focus', () => { activeRichField = elem; });
      elem.addEventListener('paste', handlePaste);
    });

    document.querySelectorAll('input, select').forEach(elem => {
      elem.addEventListener('change', () => markDirty(elem));
      elem.addEventListener('input', () => markDirty(elem));
    });

    // Eventos de selección para Toolbar
    document.addEventListener('selectionchange', handleSelectionChange);
  }

  // MANEJO DE FORMATO
  function sanitizeRichText(elem) {
    // Permite solo tags de formato básicos
    const clean = elem.innerHTML.replace(/<(?!\/?(b|i|u|font|span|br)\b)[^> text]+>/gi, '');
    if (elem.innerHTML !== clean) {
      elem.innerHTML = clean;
    }
  }

  function handlePaste(e) {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  }

  function updateCharCounter(elem) {
    const bed = elem.dataset.bed;
    const field = elem.dataset.field;
    const max = parseInt(elem.dataset.max, 10);
    const len = elem.innerText.length;
    const counter = document.getElementById(`cnt_${bed}_${field}`);

    if (counter) {
      counter.innerText = `${len}/${max}`;
      if (len > max) {
        counter.classList.add('over');
      } else {
        counter.classList.remove('over');
      }
    }
  }

  // BARRA FLOTANTE FORMATO
  function handleSelectionChange() {
    const sel = window.getSelection();
    const toolbar = document.getElementById('selectionToolbar');

    if (!sel || sel.isCollapsed || !sel.rangeCount) {
      toolbar.style.display = 'none';
      return;
    }

    const range = sel.getRangeAt(0);
    const container = range.commonAncestorContainer.nodeType === 3 ? 
                      range.commonAncestorContainer.parentNode : range.commonAncestorContainer;

    const richBox = container.closest('.rich-field');
    if (!richBox) {
      toolbar.style.display = 'none';
      return;
    }

    const rect = range.getBoundingClientRect();
    toolbar.style.top = `${Math.max(10, rect.top - 45)}px`;
    toolbar.style.left = `${Math.max(10, rect.left + (rect.width / 2) - 80)}px`;
    toolbar.style.display = 'flex';

    updateFormatState();
  }

  function updateFormatState() {
    document.getElementById('btnBold').classList.toggle('active', document.queryCommandState('bold'));
    document.getElementById('btnItalic').classList.toggle('active', document.queryCommandState('italic'));
    document.getElementById('btnUnderline').classList.toggle('active', document.queryCommandState('underline'));
  }

  document.getElementById('btnBold').onclick = () => { document.execCommand('bold'); updateFormatState(); };
  document.getElementById('btnItalic').onclick = () => { document.execCommand('italic'); updateFormatState(); };
  document.getElementById('btnUnderline').onclick = () => { document.execCommand('underline'); updateFormatState(); };

  document.getElementById('btnSizeSmall').onclick = () => { setFontSize("1"); };
  document.getElementById('btnSizeNormal').onclick = () => { setFontSize("3"); };
  document.getElementById('btnSizeLarge').onclick = () => { setFontSize("5"); };

  function setFontSize(size) {
    document.execCommand('fontSize', false, size);
  }

  function toggleAlergiaColor(select) {
    if (select.value === 'SÍ') {
      select.style.color = '#b3261e';
      select.style.fontWeight = 'bold';
    } else {
      select.style.color = '';
      select.style.fontWeight = 'normal';
    }
  }

  // GUARDADO / ESTADOS
  function markDirty(elem) {
    const parent = elem.closest('.field') || elem.closest('.bed-title');
    if (parent) {
      parent.classList.add('dirty');
      parent.classList.remove('saved');
    }
    setStatus('Cambios sin guardar...', 'saving');
  }

  function setStatus(text, type) {
    const st = document.getElementById('status');
    st.innerText = text;
    st.className = type;
  }

  function getFormData() {
    const data = {};
    for (let r = startRoom; r <= endRoom; r++) {
      ['P', 'V'].forEach(bed => {
        const id = `${r}_${bed}`;
        data[id] = {
          nombre: getHTML(`${id}`, 'nombre'),
          especialidad: getValue(`${id}`, 'especialidad'),
          alergia: getValue(`${id}`, 'alergia'),
          alergia_detalle: getValue(`${id}`, 'alergia_detalle'),
          sv_m: getCheck(`${id}`, 'sv_m'),
          sv_t: getCheck(`${id}`, 'sv_t'),
          sv_n: getCheck(`${id}`, 'sv_n'),
          cd_check: getCheck(`${id}`, 'cd_check'),
          cd_fecha: getValue(`${id}`, 'cd_fecha'),
          jc: getHTML(`${id}`, 'jc'),
          ap: getHTML(`${id}`, 'ap'),
          pte: getHTML(`${id}`, 'pte'),
          otros: getHTML(`${id}`, 'otros')
        };
      });
    }
    return data;
  }

  function getHTML(bed, field) {
    const el = document.querySelector(`[data-bed="${bed}"][data-field="${field}"]`);
    return el ? el.innerHTML : '';
  }
  function getValue(bed, field) {
    const el = document.querySelector(`[data-bed="${bed}"][data-field="${field}"]`);
    return el ? el.value : '';
  }
  function getCheck(bed, field) {
    const el = document.querySelector(`[data-bed="${bed}"][data-field="${field}"]`);
    return el ? el.checked : false;
  }

  function manualSave() {
    const data = getFormData();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

    // Envío opcional a Apps Script
    if (APPS_SCRIPT_URL && !APPS_SCRIPT_URL.includes("SCRIPT_ID")) {
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      }).catch(e => console.log('Apps Script no disponible offline'));
    }

    document.querySelectorAll('.dirty').forEach(el => {
      el.classList.remove('dirty');
      el.classList.add('saved');
    });

    setStatus('Guardado correctamente', 'ok');
    setTimeout(() => setStatus('Sincronizado', ''), 2500);
  }

  function loadData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    try {
      const data = JSON.parse(raw);
      for (let r = startRoom; r <= endRoom; r++) {
        ['P', 'V'].forEach(bed => {
          const id = `${r}_${bed}`;
          if (data[id]) {
            setHTML(id, 'nombre', data[id].nombre);
            setValue(id, 'especialidad', data[id].especialidad);
            setValue(id, 'alergia', data[id].alergia);
            setValue(id, 'alergia_detalle', data[id].alergia_detalle);
            setCheck(id, 'sv_m', data[id].sv_m);
            setCheck(id, 'sv_t', data[id].sv_t);
            setCheck(id, 'sv_n', data[id].sv_n);
            setCheck(id, 'cd_check', data[id].cd_check);
            setValue(id, 'cd_fecha', data[id].cd_fecha);
            setHTML(id, 'jc', data[id].jc);
            setHTML(id, 'ap', data[id].ap);
            setHTML(id, 'pte', data[id].pte);
            setHTML(id, 'otros', data[id].otros);
          }
        });
      }
      // Actualizar contadores
      document.querySelectorAll('.rich-field').forEach(updateCharCounter);
    } catch(e) {
      console.error("Error cargando datos", e);
    }
  }

  function setHTML(bed, field, val) {
    const el = document.querySelector(`[data-bed="${bed}"][data-field="${field}"]`);
    if (el) el.innerHTML = val || '';
  }
  function setValue(bed, field, val) {
    const el = document.querySelector(`[data-bed="${bed}"][data-field="${field}"]`);
    if (el) {
      el.value = val || '';
      if (field === 'alergia') toggleAlergiaColor(el);
    }
  }
  function setCheck(bed, field, val) {
    const el = document.querySelector(`[data-bed="${bed}"][data-field="${field}"]`);
    if (el) el.checked = !!val;
  }

  function resetForm() {
    if (confirm("¿Estás seguro de borrar todos los datos locales de esta vista?")) {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
  }

  // INICIALIZACIÓN
  window.addEventListener('DOMContentLoaded', () => {
    buildUI();
    loadData();
  });
</script>
</body>
</html>
